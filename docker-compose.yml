services:
    friday-postgres:
        image: postgres:18.1-bookworm
        container_name: friday-env-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql:Z
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: always

    friday-redis:
        image: redis:7-bookworm
        container_name: friday-env-redis
        volumes:
            - ${PROJECT_ROOT}/out/redisdata:/data:Z
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: always

    friday-postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ${PROJECT_ROOT}/migrations:/migrations:Z
        depends_on:
            friday-postgres:
                condition: service_healthy

    port-forwarder-postgres:
        image: alpine/socat:1.8.0.3
        container_name: friday-postgres-port-forwarder
        command: tcp-listen:5432,fork,reuseaddr tcp-connect:friday-postgres:5432
        ports:
            - "127.0.0.1:5433:5432"
        depends_on:
            friday-postgres:
                condition: service_healthy

    port-forwarder-redis:
        image: alpine/socat:1.8.0.3
        container_name: friday-redis-port-forwarder
        command: tcp-listen:6379,fork,reuseaddr tcp-connect:friday-redis:6379
        ports:
            - "127.0.0.1:6379:6379"
        depends_on:
            friday-redis:
                condition: service_healthy
