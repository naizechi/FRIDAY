#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata", "web", "out", "node_modules"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
